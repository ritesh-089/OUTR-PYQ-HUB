<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OUTR PYQ Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fb;
  color:#172033;
  min-height:100vh;
}

header{
  background:#ffffff;
  padding:28px 20px 22px;
  text-align:center;
  border-bottom:1px solid #e5e7eb;
}

.logo{
  font-size:28px;
  font-weight:800;
  letter-spacing:.3px;
}

.subtitle{
  margin-top:7px;
  color:#667085;
  font-size:14px;
}

.container{
  max-width:850px;
  margin:auto;
  padding:20px;
}

.search{
  width:100%;
  padding:15px 17px;
  border:1px solid #d7dce5;
  border-radius:12px;
  font-size:16px;
  outline:none;
  background:white;
  margin-bottom:20px;
}

.search:focus{
  border-color:#4f46e5;
}

.page-title{
  font-size:22px;
  margin-bottom:6px;
}

.page-subtitle{
  color:#667085;
  font-size:14px;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:white;
  border:1px solid #e8ebf0;
  border-radius:15px;
  padding:18px;
  cursor:pointer;
  transition:.15s;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}

.card-icon{
  font-size:26px;
  margin-bottom:10px;
}

.card-title{
  font-size:16px;
  font-weight:700;
}

.card-info{
  color:#667085;
  font-size:13px;
  margin-top:6px;
}

.back{
  border:none;
  background:none;
  padding:0;
  margin-bottom:18px;
  font-size:15px;
  font-weight:600;
  color:#4f46e5;
  cursor:pointer;
}

.paper{
  background:white;
  border-radius:15px;
  padding:18px;
  margin-bottom:12px;
  border:1px solid #e8ebf0;
  box-shadow:0 3px 12px rgba(0,0,0,.04);
}

.paper-title{
  font-size:17px;
  font-weight:700;
  margin-bottom:8px;
}

.paper-info{
  color:#667085;
  font-size:14px;
  line-height:1.7;
  margin-bottom:14px;
}

.buttons{
  display:flex;
  gap:9px;
}

.btn{
  text-decoration:none;
  padding:11px 15px;
  border-radius:9px;
  font-size:14px;
  font-weight:700;
  text-align:center;
}

.view{
  background:#172033;
  color:white;
}

.download{
  background:#eef2ff;
  color:#3730a3;
}

.empty{
  text-align:center;
  padding:35px 15px;
  color:#667085;
}

.loading{
  text-align:center;
  padding:40px;
  color:#667085;
}

footer{
  text-align:center;
  padding:35px 20px;
  color:#667085;
  font-size:13px;
}

footer strong{
  color:#172033;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }

  .logo{
    font-size:24px;
  }

  .buttons{
    flex-direction:column;
  }

  .btn{
    width:100%;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">OUTR PYQ HUB</div>
  <div class="subtitle">
    Previous Year Questions • OUTR Students
  </div>
</header>

<div class="container">

  <!-- HOME -->
  <section id="homePage">

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 Search subject, year or exam..."
      oninput="searchPYQ()"
    >

    <h1 class="page-title">Civil Engineering</h1>

    <p class="page-subtitle">
      Select your semester
    </p>

    <div id="semesterGrid" class="grid"></div>

  </section>


  <!-- SUBJECT PAGE -->
  <section id="subjectPage" class="hidden">

    <button class="back" onclick="showHome()">
      ← Back to Semesters
    </button>

    <h1 id="subjectTitle" class="page-title"></h1>

    <p class="page-subtitle">
      Select a subject
    </p>

    <div id="subjectGrid" class="grid"></div>

  </section>


  <!-- YEAR PAGE -->
  <section id="yearPage" class="hidden">

    <button class="back" onclick="showSubjects()">
      ← Back to Subjects
    </button>

    <h1 id="yearTitle" class="page-title"></h1>

    <p class="page-subtitle">
      Select a year
    </p>

    <div id="yearGrid" class="grid"></div>

  </section>


  <!-- EXAM PAGE -->
  <section id="examPage" class="hidden">

    <button class="back" onclick="showYears()">
      ← Back to Years
    </button>

    <h1 id="examTitle" class="page-title"></h1>

    <p class="page-subtitle">
      Select examination
    </p>

    <div id="examGrid" class="grid"></div>

  </section>


  <!-- PAPERS PAGE -->
  <section id="paperPage" class="hidden">

    <button class="back" onclick="showExams()">
      ← Back to Exams
    </button>

    <h1 id="paperTitle" class="page-title"></h1>

    <p class="page-subtitle">
      Available question paper
    </p>

    <div id="paperList"></div>

  </section>


  <!-- SEARCH RESULTS -->
  <section id="searchPage" class="hidden">

    <button class="back" onclick="showHome()">
      ← Back
    </button>

    <h1 class="page-title">Search Results</h1>

    <p class="page-subtitle">
      Matching PYQs
    </p>

    <div id="searchResults"></div>

  </section>


  <div id="loading" class="loading">
    Loading PYQs...
  </div>

</div>

<footer>
  <strong>Made by Ritesh Mallik</strong><br>
  Civil • OUTR
</footer>


<script>

const SUPABASE_URL =
"https://qxomkkmdpixjlbvyacjs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1OEksUcpmU78oj6vkW9keQ_oZUqXh7H";

const BUCKET =
"PYQS Pdfs";

let pyqs = [];

let selectedSemester = null;
let selectedSubject = null;
let selectedYear = null;
let selectedExam = null;


/* -----------------------------
   LOAD DATABASE
----------------------------- */

async function loadPYQs(){

  try{

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/pyqs?select=*&order=year.desc",
      {
        headers:{
          "apikey":SUPABASE_KEY,
          "Authorization":"Bearer "+SUPABASE_KEY
        }
      }
    );

    if(!response.ok){
      throw new Error("Database error");
    }

    pyqs = await response.json();

    document.getElementById("loading").classList.add("hidden");

    createSemesterCards();

  }catch(error){

    console.error(error);

    document.getElementById("loading").innerHTML =
      "❌ Unable to load PYQs.<br>Please try again later.";

  }

}


/* -----------------------------
   SEMESTERS
----------------------------- */

function createSemesterCards(){

  const grid =
    document.getElementById("semesterGrid");

  const semesters =
    [...new Set(pyqs.map(p => p.semester))]
    .sort((a,b)=>a-b);

  if(semesters.length===0){

    grid.innerHTML =
      `<div class="empty">No PYQs available yet.</div>`;

    return;
  }

  grid.innerHTML = semesters.map(sem => `

    <div class="card"
         onclick="openSemester(${sem})">

      <div class="card-icon">📚</div>

      <div class="card-title">
        ${getOrdinal(sem)} Semester
      </div>

      <div class="card-info">
        ${countSemester(sem)} PYQ(s)
      </div>

    </div>

  `).join("");

}


/* -----------------------------
   SUBJECTS
----------------------------- */

function openSemester(semester){

  selectedSemester = semester;

  hideAll();

  document
    .getElementById("subjectPage")
    .classList.remove("hidden");

  document
    .getElementById("subjectTitle")
    .textContent =
      getOrdinal(semester) + " Semester";

  const subjects =
    [...new Set(
      pyqs
      .filter(p => Number(p.semester) === Number(semester))
      .map(p => p.subject)
    )]
    .sort();

  const grid =
    document.getElementById("subjectGrid");

  grid.innerHTML = subjects.map(subject => `

    <div class="card"
         onclick='openSubject(${JSON.stringify(subject)})'>

      <div class="card-icon">📖</div>

      <div class="card-title">
        ${escapeHTML(subject)}
      </div>

      <div class="card-info">
        ${countSubject(subject)} PYQ(s)
      </div>

    </div>

  `).join("");

}


function openSubject(subject){

  selectedSubject = subject;

  hideAll();

  document
    .getElementById("yearPage")
    .classList.remove("hidden");

  document
    .getElementById("yearTitle")
    .textContent =
      subject;

  const years =
    [...new Set(
      pyqs
      .filter(p =>
        Number(p.semester) === Number(selectedSemester) &&
        p.subject === selectedSubject
      )
      .map(p => Number(p.year))
    )]
    .sort((a,b)=>b-a);

  const grid =
    document.getElementById("yearGrid");

  grid.innerHTML = years.map(year => `

    <div class="card"
         onclick="openYear(${year})">

      <div class="card-icon">📅</div>

      <div class="card-title">
        ${year}
      </div>

      <div class="card-info">
        View available papers
      </div>

    </div>

  `).join("");

}


/* -----------------------------
   YEARS
----------------------------- */

function openYear(year){

  selectedYear = year;

  hideAll();

  document
    .getElementById("examPage")
    .classList.remove("hidden");

  document
    .getElementById("examTitle")
    .textContent =
      selectedSubject + " • " + year;

  const exams =
    [...new Set(
      pyqs
      .filter(p =>
        Number(p.semester) === Number(selectedSemester) &&
        p.subject === selectedSubject &&
        Number(p.year) === Number(selectedYear)
      )
      .map(p => p.exam_type)
    )]
    .sort();

  const grid =
    document.getElementById("examGrid");

  grid.innerHTML = exams.map(exam => `

    <div class="card"
         onclick='openExam(${JSON.stringify(exam)})'>

      <div class="card-icon">
        ${exam === "Mid Term" ? "📝" : "📄"}
      </div>

      <div class="card-title">
        ${escapeHTML(exam)}
      </div>

      <div class="card-info">
        ${selectedYear}
      </div>

    </div>

  `).join("");

}


/* -----------------------------
   EXAM
----------------------------- */

function openExam(exam){

  selectedExam = exam;

  hideAll();

  document
    .getElementById("paperPage")
    .classList.remove("hidden");

  document
    .getElementById("paperTitle")
    .textContent =
      selectedSubject;

  const papers =
    pyqs.filter(p =>
      Number(p.semester) === Number(selectedSemester) &&
      p.subject === selectedSubject &&
      Number(p.year) === Number(selectedYear) &&
      p.exam_type === selectedExam
    );

  const list =
    document.getElementById("paperList");

  list.innerHTML = papers.map(paper => {

    const url = getPDFUrl(paper.file_path);

    return `

      <div class="paper">

        <div class="paper-title">
          📄 ${escapeHTML(paper.title)}
        </div>

        <div class="paper-info">

          🏗️ ${escapeHTML(paper.branch)}
          <br>

          📚 ${getOrdinal(paper.semester)} Semester
          <br>

          📝 ${escapeHTML(paper.exam_type)}
          • ${paper.year}

        </div>

        <div class="buttons">

          <a
            class="btn view"
            href="${url}"
            target="_blank"
          >
            📖 View PDF
          </a>

          <a
            class="btn download"
            href="${url}"
            download
          >
            ⬇️ Download
          </a>

        </div>

      </div>

    `;

  }).join("");

}


/* -----------------------------
   SEARCH
----------------------------- */

function searchPYQ(){

  const query =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  if(!query){

    showHome();
    return;
  }

  hideAll();

  document
    .getElementById("searchPage")
    .classList.remove("hidden");

  const results =
    pyqs.filter(p => {

      const text = (

        p.branch + " " +
        p.subject + " " +
        p.subject_code + " " +
        p.exam_type + " " +
        p.year + " " +
        p.semester + " " +
        p.title

      ).toLowerCase();

      return text.includes(query);

    });

  const box =
    document.getElementById("searchResults");

  if(results.length===0){

    box.innerHTML =
      `<div class="empty">
        📭 No matching PYQs found.
      </div>`;

    return;
  }

  box.innerHTML =
    results.map(paper => {

      const url =
        getPDFUrl(paper.file_path);

      return `

        <div class="paper">

          <div class="paper-title">
            📄 ${escapeHTML(paper.title)}
          </div>

          <div class="paper-info">

            🏗️ ${escapeHTML(paper.branch)}
            <br>

            📚 ${getOrdinal(paper.semester)}
            Semester
            <br>

            📖 ${escapeHTML(paper.subject)}
            <br>

            📝 ${escapeHTML(paper.exam_type)}
            • ${paper.year}

          </div>

          <div class="buttons">

            <a
              class="btn view"
              href="${url}"
              target="_blank"
            >
              📖 View PDF
            </a>

            <a
              class="btn download"
              href="${url}"
              download
            >
              ⬇️ Download
            </a>

          </div>

        </div>

      `;

    }).join("");

}


/* -----------------------------
   NAVIGATION
----------------------------- */

function hideAll(){

  [
    "homePage",
    "subjectPage",
    "yearPage",
    "examPage",
    "paperPage",
    "searchPage"
  ].forEach(id => {

    document
      .getElementById(id)
      .classList.add("hidden");

  });

}

function showHome(){

  hideAll();

  document
    .getElementById("homePage")
    .classList.remove("hidden");

  document
    .getElementById("search")
    .value = "";

}

function showSubjects(){

  hideAll();

  document
    .getElementById("subjectPage")
    .classList.remove("hidden");

}

function showYears(){

  hideAll();

  document
    .getElementById("yearPage")
    .classList.remove("hidden");

}

function showExams(){

  hideAll();

  document
    .getElementById("examPage")
    .classList.remove("hidden");

}


/* -----------------------------
   HELPERS
----------------------------- */

function countSemester(semester){

  return pyqs.filter(
    p => Number(p.semester) === Number(semester)
  ).length;

}

function countSubject(subject){

  return pyqs.filter(
    p =>
      Number(p.semester) === Number(selectedSemester) &&
      p.subject === subject
  ).length;

}

function getOrdinal(number){

  number = Number(number);

  if(number === 1) return "1st";
  if(number === 2) return "2nd";
  if(number === 3) return "3rd";

  return number + "th";

}

function getPDFUrl(path){

  return (
    SUPABASE_URL +
    "/storage/v1/object/public/" +
    encodeURIComponent(BUCKET) +
    "/" +
    path
      .split("/")
      .map(encodeURIComponent)
      .join("/")
  );

}

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* START */

loadPYQs();

</script>

</body>
  </html>
