<script>


/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
"https://qxomkkmdpixjlbvyacjs.supabase.co";

const SUPABASE_KEY =
"sb_publishable_1OEksUcpmU78oj6vkW9keQ_oZUqXh7H";

const BUCKET =
"PYQS Pdfs";


/* =========================================================
   VARIABLES
========================================================= */

let pyqs = [];

let editingId = null;

let refreshingToken = false;


/* =========================================================
   GET ACCESS TOKEN
========================================================= */

function getAccessToken(){

  return localStorage.getItem(
    "outr_access_token"
  );

}


/* =========================================================
   GET REFRESH TOKEN
========================================================= */

function getRefreshToken(){

  return localStorage.getItem(
    "outr_refresh_token"
  );

}


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
  endpoint,
  options = {},
  retry = true
){

  const token =
    getAccessToken();


  if(!token){

    throw new Error(
      "You are not logged in."
    );

  }


  const headers = {

    "apikey":
      SUPABASE_KEY,

    "Authorization":
      "Bearer "+token,

    ...(options.headers || {})

  };


  const response =
    await fetch(
      SUPABASE_URL + endpoint,
      {
        ...options,
        headers
      }
    );


  /*
     ACCESS TOKEN EXPIRED
  */

  if(
    response.status === 401 &&
    retry
  ){

    const refreshed =
      await refreshSession();


    if(refreshed){

      return supabaseRequest(
        endpoint,
        options,
        false
      );

    }

  }


  return response;

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

  const email =
    document
      .getElementById("loginEmail")
      .value
      .trim();


  const password =
    document
      .getElementById("loginPassword")
      .value;


  if(!email || !password){

    showMessage(
      "loginMessage",
      "❌ Please enter email and password.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "loginButton"
    );


  button.disabled = true;

  button.textContent =
    "⏳ Logging in...";


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/auth/v1/token?grant_type=password",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({

            email:email,

            password:password

          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error_description ||
        data.msg ||
        data.message ||
        "Invalid email or password."
      );

    }


    /*
       SAVE SESSION
    */

    localStorage.setItem(
      "outr_access_token",
      data.access_token
    );


    localStorage.setItem(
      "outr_refresh_token",
      data.refresh_token
    );


    localStorage.setItem(
      "outr_user_email",
      email
    );


    showAdmin();


  }catch(error){

    console.error(error);

    showMessage(
      "loginMessage",
      "❌ "+error.message,
      "error"
    );

  }finally{

    button.disabled = false;

    button.textContent =
      "🔑 Login";

  }

}


/* =========================================================
   REFRESH SESSION
========================================================= */

async function refreshSession(){

  if(refreshingToken){

    return false;

  }


  const refreshToken =
    getRefreshToken();


  if(!refreshToken){

    return false;

  }


  refreshingToken = true;


  try{

    const response =
      await fetch(
        SUPABASE_URL+
        "/auth/v1/token?grant_type=refresh_token",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_KEY
          },

          body:JSON.stringify({

            refresh_token:
              refreshToken

          })
        }
      );


    const data =
      await response.json();


    if(!response.ok){

      logout();

      return false;

    }


    localStorage.setItem(
      "outr_access_token",
      data.access_token
    );


    if(data.refresh_token){

      localStorage.setItem(
        "outr_refresh_token",
        data.refresh_token
      );

    }


    return true;


  }catch(error){

    console.error(
      "Token refresh failed:",
      error
    );

    return false;

  }finally{

    refreshingToken = false;

  }

}


/* =========================================================
   SHOW ADMIN
========================================================= */

function showAdmin(){

  document
    .getElementById("loginSection")
    .classList.add("hidden");


  document
    .getElementById("adminSection")
    .classList.remove("hidden");


  const email =
    localStorage.getItem(
      "outr_user_email"
    );


  const info =
    document.querySelector(
      ".admin-info"
    );


  if(email){

    info.innerHTML =
      `
      🔐 <strong>Admin Mode Active</strong>
      <br>
      Logged in as:
      <strong>${escapeHTML(email)}</strong>
      `;

  }


  loadPYQs();

}


/* =========================================================
   LOGOUT
========================================================= */

async function logout(){

  const token =
    getAccessToken();


  /*
     Sign out from Supabase
  */

  if(token){

    try{

      await fetch(
        SUPABASE_URL+
        "/auth/v1/logout",
        {
          method:"POST",

          headers:{
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+token
          }
        }
      );

    }catch(error){

      console.warn(
        "Logout request failed:",
        error
      );

    }

  }


  localStorage.removeItem(
    "outr_access_token"
  );

  localStorage.removeItem(
    "outr_refresh_token"
  );

  localStorage.removeItem(
    "outr_user_email"
  );


  location.reload();

}


/* =========================================================
   LOAD PYQS
========================================================= */

async function loadPYQs(){

  const list =
    document.getElementById(
      "adminList"
    );


  list.innerHTML =
    `
    <div class="loading">
      ⏳ Loading PYQs...
    </div>
    `;


  try{

    const response =
      await supabaseRequest(
        "/rest/v1/pyqs?select=*&order=year.desc,id.desc"
      );


    if(!response.ok){

      const error =
        await response.text();

      throw new Error(
        error ||
        "Could not load PYQs."
      );

    }


    pyqs =
      await response.json();


    displayAdminPYQs(
      pyqs
    );


  }catch(error){

    console.error(error);

    list.innerHTML =
      `
      <div class="message error">
        ❌ Could not load PYQs.
        <br><br>
        ${escapeHTML(error.message)}
      </div>
      `;

  }

}


/* =========================================================
   DISPLAY PYQS
========================================================= */

function displayAdminPYQs(
  data
){

  const list =
    document.getElementById(
      "adminList"
    );


  if(!data || data.length===0){

    list.innerHTML =
      `
      <div class="loading">
        📭 No PYQs found.
      </div>
      `;

    return;

  }


  list.innerHTML =
    data.map(
      paper => {

        const url =
          getPDFUrl(
            paper.file_path
          );


        return `

        <div class="paper">

          <div class="paper-title">

            📄
            ${escapeHTML(
              paper.title ||
              "Untitled PYQ"
            )}

          </div>


          <div class="paper-info">

            🏗️
            ${escapeHTML(
              paper.branch || ""
            )}

            <br>

            📚
            ${ordinal(
              paper.semester
            )}
            Semester

            <br>

            📖
            ${escapeHTML(
              paper.subject || ""
            )}

            ${
              paper.subject_code
              ?
              " ("+
              escapeHTML(
                paper.subject_code
              )+
              ")"
              :
              ""
            }

            <br>

            📝
            ${escapeHTML(
              paper.exam_type || ""
            )}

            •
            ${escapeHTML(
              paper.year || ""
            )}

          </div>


          <div class="actions">

            <a
              class="view"
              href="${url}"
              target="_blank"
              rel="noopener"
            >
              📖 View
            </a>


            <button
              class="edit"
              onclick="editPYQ(${Number(paper.id)})"
            >
              ✏️ Edit
            </button>


            <button
              class="danger"
              onclick="deletePYQ(${Number(paper.id)})"
            >
              🗑️ Delete
            </button>

          </div>

        </div>

        `;

      }
    ).join("");

}


/* =========================================================
   SEARCH
========================================================= */

function filterAdminPYQs(){

  const query =
    document
      .getElementById("adminSearch")
      .value
      .toLowerCase()
      .trim();


  if(!query){

    displayAdminPYQs(
      pyqs
    );

    return;

  }


  const results =
    pyqs.filter(
      paper => {

        const text =
          [

            paper.branch,

            paper.subject,

            paper.subject_code,

            paper.exam_type,

            paper.year,

            paper.semester,

            paper.title

          ]
          .join(" ")
          .toLowerCase();


        return text.includes(
          query
        );

      }
    );


  displayAdminPYQs(
    results
  );

}


/* =========================================================
   EDIT PYQ
========================================================= */

function editPYQ(id){

  const paper =
    pyqs.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!paper){

    alert(
      "❌ PYQ not found."
    );

    return;

  }


  editingId =
    Number(id);


  document
    .getElementById("formTitle")
    .textContent =
      "✏️ Edit PYQ";


  document
    .getElementById("branch")
    .value =
      paper.branch || "Civil";


  document
    .getElementById("semester")
    .value =
      paper.semester || "1";


  document
    .getElementById("subject")
    .value =
      paper.subject || "";


  document
    .getElementById("subjectCode")
    .value =
      paper.subject_code || "";


  document
    .getElementById("year")
    .value =
      paper.year || "";


  document
    .getElementById("examType")
    .value =
      paper.exam_type || "Mid Term";


  document

      "currentFile"

  });

}


/* =========================================================

========================================================= */

    .getElementById("cancelButton")
    .classList.add(

    );

    .getElementById("fileLabel")
    .textContent =

  document
    .getElementById("currentFile")

      "hidden"
    );

    .getElementById("pdfFile")
    .value =

}


/* =========================================================
   SAVE / UPDATE PYQ
========================================================= */

async function savePYQ(){

  const branch =
    document
      .getElementById("branch")
      .value
      .trim();


  const semester =
    Number(
      document
        .getElementById("semester")
        .value
    );


  const subject =
    document
      .getElementById("subject")
      .value
      .trim();


  const subjectCode =
    document
      .getElementById("subjectCode")
      .value
      .trim();


  const year =
    Number(
      document
        .getElementById("year")
        .value
    );


  const examType =
    document
      .getElementById("examType")
      .value;


  const title =
    document
      .getElementById("title")
      .value
      .trim();


  const file =
    document
      .getElementById("pdfFile")
      .files[0];


  /* VALIDATION */

  if(
    !branch ||
    !semester ||
    !subject ||
    !year ||
    !examType ||
    !title
  ){

    showMessage(
      "formMessage",
      "❌ Please fill all required fields.",
      "error"
    );

    return;

  }


  if(
    file &&
    file.type !==
    "application/pdf"
  ){

    showMessage(
      "formMessage",
      "❌ Only PDF files are allowed.",
      "error"
    );

    return;

  }


  if(
    file &&
    file.size >
    20 * 1024 * 1024
  ){

    showMessage(
      "formMessage",
      "❌ PDF must be smaller than 20 MB.",
      "error"
    );

    return;

  }


  if(!getAccessToken()){

    showMessage(
      "formMessage",
      "❌ Your login session has expired. Please login again.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "submitButton"
    );


  button.disabled = true;


  button.textContent =
    editingId
    ?
    "⏳ Updating..."
    :
    "⏳ Uploading...";


  try{


    /* =====================================================
       UPDATE EXISTING
    ===================================================== */

    if(editingId){

      const oldPaper =
        pyqs.find(
          p =>
            Number(p.id) ===
            Number(editingId)
        );


      if(!oldPaper){

        throw new Error(
          "PYQ record not found."
        );

      }


      let filePath =
        oldPaper.file_path;


      /*
         REPLACE PDF
      */

      if(file){

        const newPath =
          createFilePath(
            semester,
            subjectCode,
            year,
            file.name
          );


        const uploadResponse =
          await uploadPDF(
            file,
            newPath
          );


        if(!uploadResponse.ok){

          const error =
            await uploadResponse.text();

          throw new Error(
            "PDF upload failed: "+
            error
          );

        }


        filePath =
          newPath;

      }


      /*
         DATABASE UPDATE
      */

      const updateData = {

        branch:
          branch,

        semester:
          semester,

        subject:
          subject,

        subject_code:
          subjectCode ||
          null,

        year:
          year,

        exam_type:
          examType,

        title:
          title,

        file_path:
          filePath

      };


      const response =
        await supabaseRequest(
          "/rest/v1/pyqs?id=eq."+
          encodeURIComponent(
            editingId
          ),
          {
            method:"PATCH",

            headers:{
              "Content-Type":
                "application/json",

              "Prefer":
                "return=representation"
            },

            body:
              JSON.stringify(
                updateData
              )
          }
        );


      if(!response.ok){

        const error =
          await response.text();

        throw new Error(
          "Database update failed:\n"+
          error
        );

      }


      const updated =
        await response.json();


      /*
         IMPORTANT:
         EMPTY ARRAY = RLS POLICY BLOCKED
      */

      if(
        !Array.isArray(updated) ||
        updated.length === 0
      ){

        throw new Error(
          "No record was updated.\n\n"+
          "Your Supabase UPDATE policy is not allowing this admin account."
        );

      }


      /*
         DELETE OLD PDF
         ONLY AFTER DATABASE UPDATE SUCCESS
      */

      if(
        file &&
        oldPaper.file_path &&
        oldPaper.file_path !== filePath
      ){

        await deleteStorageFile(
          oldPaper.file_path
        );

      }


      showMessage(
        "formMessage",
        "✅ PYQ updated successfully!",
        "success"
      );


      cancelEdit();

      await loadPYQs();


      return;

    }


    /* =====================================================
       NEW UPLOAD
    ===================================================== */

    if(!file){

      showMessage(
        "formMessage",
        "❌ Please select a PDF file.",
        "error"
      );

      return;

    }


    const filePath =
      createFilePath(
        semester,
        subjectCode,
        year,
        file.name
      );


    /*
       UPLOAD PDF
    */

    const uploadResponse =
      await uploadPDF(
        file,
        filePath
      );


    if(!uploadResponse.ok){

      const error =
        await uploadResponse.text();

      throw new Error(
        "PDF upload failed:\n"+
        error
      );

    }


    /*
       INSERT DATABASE RECORD
    */

    const insertData = {

      branch:
        branch,

      semester:
        semester,

      subject:
        subject,

      subject_code:
        subjectCode ||
        null,

      year:
        year,

      exam_type:
        examType,

      title:
        title,

      file_path:
        filePath

    };


    const response =
      await supabaseRequest(
        "/rest/v1/pyqs",
        {
          method:"POST",

          headers:{
            "Content-Type":
              "application/json",

            "Prefer":
              "return=representation"
          },

          body:
            JSON.stringify(
              insertData
            )
        }
      );


    if(!response.ok){

      const error =
        await response.text();

      /*
         DATABASE INSERT FAILED
         REMOVE UPLOADED PDF
      */

      await deleteStorageFile(
        filePath
      );


      throw new Error(
        "Database insert failed:\n"+
        error
      );

    }


    showMessage(
      "formMessage",
      "✅ PYQ uploaded successfully!",
      "success"
    );


    clearForm();

    await loadPYQs();


  }catch(error){

    console.error(error);

    showMessage(
      "formMessage",
      "❌ "+error.message,
      "error"
    );

  }finally{

    button.disabled =
      false;


    button.textContent =
      editingId
      ?
      "💾 Update PYQ"
      :
      "⬆️ Upload PYQ";

  }

}


/* =========================================================
   UPLOAD PDF
========================================================= */

async function uploadPDF(
  file,
  path
){

  const token =
    getAccessToken();


  if(!token){

    throw new Error(
      "Authentication token missing."
    );

  }


  return fetch(
    SUPABASE_URL+
    "/storage/v1/object/"+
    encodeURIComponent(
      BUCKET
    )+
    "/"+
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/"),
    {
      method:"POST",

      headers:{

        "apikey":
          SUPABASE_KEY,

        "Authorization":
          "Bearer "+token,

        "Content-Type":
          "application/pdf",

        "x-upsert":
          "true"

      },

      body:file

    }
  );

}


/* =========================================================
   DELETE STORAGE FILE
========================================================= */

async function deleteStorageFile(
  path
){

  if(!path){

    return;

  }


  const token =
    getAccessToken();


  if(!token){

    console.warn(
      "No access token for storage delete."
    );

    return;

  }


  try{

    /*
       CORRECT SUPABASE STORAGE REMOVE API
    */

    const response =
      await fetch(
        SUPABASE_URL+
        "/storage/v1/object/"+
        "remove",
        {
          method:"POST",

          headers:{

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer "+token,

            "Content-Type":
              "application/json"

          },

          body:
            JSON.stringify({

              bucket:
                BUCKET,

              prefixes:[
                path
              ]

            })

        }
      );


    if(!response.ok){

      console.warn(
        "Storage delete failed:",
        await response.text()
      );

    }

  }catch(error){

    console.warn(
      "Old PDF could not be deleted:",
      error
    );

  }

}


/* =========================================================
   DELETE PYQ
========================================================= */

async function deletePYQ(
  id
){

  const paper =
    pyqs.find(
      p =>
        Number(p.id) ===
        Number(id)
    );


  if(!paper){

    alert(
      "❌ PYQ not found."
    );

    return;

  }


  const confirmed =
    confirm(
      "Are you sure you want to delete this PYQ?\n\n"+
      (
        paper.title ||
        "Untitled PYQ"
      )
    );


  if(!confirmed){

    return;

  }


  try{

    /*
       DELETE DATABASE RECORD
    */

    const response =
      await supabaseRequest(
        "/rest/v1/pyqs?id=eq."+
        encodeURIComponent(id),
        {
          method:"DELETE",

          headers:{
            "Prefer":
              "return=representation"
          }
        }
      );


    if(!response.ok){

      const error =
        await response.text();

      throw new Error(
        "Database delete failed:\n"+
        error
      );

    }


    const deleted =
      await response.json();


    if(
      !Array.isArray(deleted) ||
      deleted.length===0
    ){

      throw new Error(
        "No record was deleted.\n\n"+
        "Check your Supabase DELETE policy."
      );

    }


    /*
       DELETE PDF
    */

    if(paper.file_path){

      await deleteStorageFile(
        paper.file_path
      );

    }


    alert(
      "✅ PYQ deleted successfully!"
    );


    await loadPYQs();


  }catch(error){

    console.error(error);

    alert(
      "❌ Could not delete PYQ\n\n"+
      error.message
    );

  }

}


/* =========================================================
   CREATE FILE PATH
========================================================= */

function createFilePath(
  semester,
  subjectCode,
  year,
  originalName
){

  const safeCode =
    (
      subjectCode ||
      "PYQ"
    )
    .replace(
      /[^a-zA-Z0-9_-]/g,
      "_"
    );


  const safeName =
    originalName
      .replace(
        /\.pdf$/i,
        ""
      )
      .replace(
        /[^a-zA-Z0-9_-]/g,
        "_"
      );


  const random =
    Date.now();


  return (
    "semester-"+
    semester+
    "/"+
    safeCode+
    "_"+
    year+
    "_"+
    safeName+
    "_"+
    random+
    ".pdf"
  );

}


/* =========================================================
   PDF URL
========================================================= */

function getPDFUrl(
  path
){

  if(!path){

    return "#";

  }


  return (
    SUPABASE_URL+
    "/storage/v1/object/public/"+
    encodeURIComponent(
      BUCKET
    )+
    "/"+
    path
      .split("/")
      .map(
        encodeURIComponent
      )
      .join("/")
  );

}


/* =========================================================
   CLEAR FORM
========================================================= */

function clearForm(){

    .getElementById("subject")
    .value = "";


  document
    .getElementById("subjectCode")
    .value = "";


  document

/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
  id,
  text,
  type
){

  const element =
    document.getElementById(
      id
    );


  element.textContent =
    text;


  element.className =
    "message "+type;


  element.style.display =
    "block";

}


function hideMessage(
  id
){

  const element =
    document.getElementById(
      id
    );


  element.style.display =
    "none";

}


/* =========================================================
   ORDINAL
========================================================= */

function ordinal(n){

  n =
    Number(n);


  if(n===1)
    return "1st";


  if(n===2)
    return "2nd";


  if(n===3)
    return "3rd";


  return n+"th";

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(
  text
){

  return String(
    text ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

window.addEventListener(
  "load",
  async () => {

    const token =
      getAccessToken();


    if(!token){

      return;

    }


    /*
       Try existing token first
    */

    try{

      const response =
        await fetch(
          SUPABASE_URL+
          "/auth/v1/user",
          {
            headers:{

              "apikey":
                SUPABASE_KEY,

              "Authorization":
                "Bearer "+token

            }
          }
        );


      if(response.ok){

        showAdmin();

        return;

      }


      /*
         Token expired.
         Try refresh.
      */

      const refreshed =
        await refreshSession();


      if(refreshed){

        showAdmin();

      }else{

        logout();

      }


    }catch(error){

      console.error(
        "Session check failed:",
        error
      );

    }

  }
);
